name: Boscdex CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint_and_format:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static code analysis
        run: flutter analyze --fatal-infos --fatal-warnings

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint_and_format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit test suite
        run: flutter test test/unit_tests/ --exclude-tags ml_benchmark

  integration_tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint_and_format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run integration test suite
        run: flutter test test/integration_tests/

  e2e_tests:
    name: End-to-End (E2E) Tests
    runs-on: ubuntu-latest
    needs: [unit_tests, integration_tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run E2E test suite
        run: flutter test test/e2e_tests/
