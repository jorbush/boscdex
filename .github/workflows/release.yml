name: Build & Release Multi-Artifact Packages

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g. v1.0.0, v1.1.0, v1.2.0

permissions:
  contents: write

jobs:
  build_release:
    name: Build Multi-Artifact Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code analysis & unit tests
        run: |
          flutter analyze --fatal-infos --fatal-warnings
          flutter test test/unit_tests/ --exclude-tags "ml_benchmark,golden"

      - name: Build Universal Release APK (~100 MB)
        run: flutter build apk --release

      - name: Build Lightweight Split-per-ABI APKs (~30 MB)
        run: flutter build apk --split-per-abi

      - name: Build Google Play App Bundle (.aab, ~25 MB)
        run: flutter build appbundle --release

      - name: Create GitHub Release & Upload Multi-Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          name: Boscdex ${{ github.ref_name }}
          body: |
            ### 📦 Download Assets & Recommendations
            * **`app-arm64-v8a-release.apk`** (~30 MB) — **⭐ Recommended**: Ultra-lightweight APK optimized for modern 64-bit Android smartphones.
            * **`app-release.apk`** (~100 MB) — Universal standalone APK bundling all CPU architectures (works on any Android device).
            * **`app-armeabi-v7a-release.apk`** (~30 MB) — Lightweight APK for legacy 32-bit Android devices.
            * **`app-release.aab`** (~25 MB) — Production Android App Bundle for Google Play Console submission.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
